<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitality & Balance</title>
    <link href="./assets/css/output.css" rel="stylesheet">
</head>
<body>
    <!-- Layout Shell -->
    <div class="flex">
        <!-- Aside - Sidebar Navigation (Desktop) - Section -->
        <aside class="hidden lg:flex sticky top-0 col justify-between p-6 h-screen w-[288px] bg-seventh border-e border-e-fourth/10">
            <!-- Logo -->
            <div class="mb-12">
                <img src="./assets/imgs/nav_imags/Logo-text.svg" alt="logo image">
            </div>
            <!-- Nav -->
            <nav class="col gap-2 flex-1">
                <a href="#" class="group row gap-4 py-6 px-4 rounded-3xl bg-third shadow-first">
                    <div class="group-hover:scale-110 transition-transform">
                        <img src="./assets/imgs/user_dashboard_images/overview.svg" alt="overview icon">
                    </div>
                    <span class="sidebar-link-name sidebar-selected-link-color">overview</span>
                </a>
                <a href="#" class="sidebar-link">
                    <div>
                        <img src="./assets/imgs/user_dashboard_images/tools.svg" alt="tools icon">
                    </div>
                    <span class="sidebar-link-name sidebar-non-selected-link-color">tools</span>
                </a>
                <a href="#" class="sidebar-link">
                    <div>
                        <img src="./assets/imgs/user_dashboard_images/saved_content.svg" alt="saved content icon">
                    </div>
                    <span class="sidebar-link-name sidebar-non-selected-link-color">saved content</span>
                </a>
                <a href="#" class="sidebar-link">
                    <div>
                        <img src="./assets/imgs/user_dashboard_images/coaching.svg" alt="coaching icon">
                    </div>
                    <span class="sidebar-link-name sidebar-non-selected-link-color">coaching</span>
                </a>
            </nav>
            <!-- HorizontalBorder -->
            <div class="pt-6 border-t border-t-fourth/20">
                <a href="#" class="sidebar-link">
                    <span>
                        <img src="./assets/imgs/user_dashboard_images/settings.svg" alt="settings">
                    </span>
                    <span class="sidebar-link-name sidebar-non-selected-link-color">settings</span>
                </a>
            </div>

        </aside>
        <!-- Main Content Area -->
        <main class="flex-1">
            <header class="bg-nav/70 py-[19.5px] backdrop-blur-md sticky top-0 z-20">
                <div class="container row justify-between">
                    <div class="lg:hidden">
                        <img src="./assets/imgs/user_dashboard_images/leaf_logo.svg" alt="leaf logo icon">
                    </div>
                    <div class="hidden md:col">
                        <h3 class="pb-[0.59px] text-eleventh">Good morning, Alex</h3>
                        <p class="text-[16px] leading-6 text-nav-link">Your wellness journey is on track today.</p>
                    </div>
                    <div class="row gap-6">
                        <div class="row gap-2 py-2 px-6 rounded-full bg-twentieth">
                            <span>
                                <img src="./assets/imgs/user_dashboard_images/fire.svg" alt="fire icon">
                            </span>
                            <span class="text-[16px] text-fifteenth">12 DAY STREAK</span>
                        </div>
                        <button class="rounded-full overflow-hidden hover:ring-2 ring-third transition-all">
                            <img src="./assets/imgs/user_dashboard_images/profile.webp" alt="profile image">
                        </button>
                    </div>
                    <button class="lg:hidden">
                        <img src="./assets/imgs/user_dashboard_images/menu.svg" alt="menu icon">
                    </button>
                </div>
            </header>
            <section class="col gap-12 pt-6 pb-12 md:py-6 bg-secondaryC">
                <!-- Section - Stat Band -->
                <div class="container grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Water Intake Card -->
                    <div class="row gap-6 py-13 px-6 bg-white stat-band-card">
                        <span>
                            <img src="./assets/imgs/user_dashboard_images/percentage.svg" alt="percentage icon">
                        </span>
                        <div class="col gap-1">
                            <span class="text-[16px] leading-6 text-nav-link">WATER INTAKE</span>
                            <span class="text-[16px] leading-6 font-secondary text-third">1.4L / 2L</span>
                            <button class="row pt-1 gap-2 hover:underline">
                                <span>
                                    <img src="./assets/imgs/user_dashboard_images/add.svg" alt="add icon">
                                </span>
                                <span class="text-[16px] leading-6 text-third text-center">
                                    Add Cup
                                </span>
                            </button>
                        </div>
                    </div>
                    <!-- Streak Bar Card -->
                    <div class="col gap-6 p-6 bg-white stat-band-card">
                        <div class="row justify-between">
                            <span class="text-[16px] leading-6 text-nav-link">WEEKLY GOAL</span>
                            <span class="text-[16px] leading-6 font-bold text-third">5/7 Days</span>
                        </div>
                        <div class="row gap-1 p-1 rounded-full bg-twentyThree/30">
                            <div class="streak-bar-card-polygon bg-third"></div>
                            <div class="streak-bar-card-polygon bg-third"></div>
                            <div class="streak-bar-card-polygon bg-third"></div>
                            <div class="streak-bar-card-polygon bg-third"></div>
                            <div class="streak-bar-card-polygon bg-third"></div>
                            <div class="streak-bar-card-polygon bg-nineteenth/30"></div>
                            <div class="streak-bar-card-polygon bg-nineteenth/30"></div>
                        </div>
                        <p class="text-[16px] leading-6 text-nav-link xl:w-[250.67px]">
                            You're 2 days away from your weekly reward!
                        </p>
                    </div>
                    <!-- Next Session Card -->
                    <div class="relative col p-6 pb-19 bg-thirteenth stat-band-card">
                        <div class="col gap-1">
                            <p class="text-[16px] leading-6 text-seventeenth/80">UPCOMING SESSION</p>
                            <h3 class="text-[16px] leading-6 font-secondary text-fourteenth">Breathwork Basics</h3>
                            <div class="row gap-4 pt-5">
                                <span>
                                    <img src="./assets/imgs/user_dashboard_images/clock.svg" alt="clock icon">
                                </span>
                                <span class="text-[16px] leading-6 text-fourteenth">Today at 4:30 PM</span>
                            </div>
                        </div>
                        <div class="absolute bottom-0 right-0">
                            <img src="./assets/imgs/user_dashboard_images/leaf.svg" alt="leaf icon">
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
